<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Add News - Pushpak News Admin
  </title>

  <!-- GOOGLE FONT -->

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- FONT AWESOME -->

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >

  <!-- CSS -->

  <style>

    *{

      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;

    }

    body{

      background:#f5f7fb;
      display:flex;
      min-height:100vh;

    }

    body.dark-mode{

      background:#111827;
      color:#fff;

    }

    /* MOBILE MENU */

    .mobile-menu-btn{

      position:fixed;
      top:15px;
      left:15px;
      width:45px;
      height:45px;
      background:#ff3c00;
      color:#fff;
      border-radius:10px;
      display:none;
      align-items:center;
      justify-content:center;
      font-size:20px;
      cursor:pointer;
      z-index:2000;

    }

    /* SIDEBAR */

    .sidebar{

      width:270px;
      background:#111827;
      color:#fff;
      min-height:100vh;
      padding:25px 20px;
      position:fixed;
      left:0;
      top:0;
      overflow-y:auto;
      transition:0.3s;
      z-index:1000;

    }

    .sidebar-logo{

      font-size:28px;
      font-weight:700;
      text-align:center;
      margin-bottom:40px;

    }

    .sidebar ul{

      list-style:none;

    }

    .sidebar ul li{

      margin-bottom:12px;

    }

    .sidebar ul li a{

      display:flex;
      align-items:center;
      gap:14px;
      padding:15px;
      border-radius:12px;
      text-decoration:none;
      color:#fff;
      transition:0.3s;

    }

    .sidebar ul li.active a,
    .sidebar ul li a:hover{

      background:#ff3c00;

    }

    /* MAIN CONTENT */

    .main-content{

      flex:1;
      margin-left:270px;
      padding:30px;

    }

    /* TOPBAR */

    .topbar{

      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:20px;
      margin-bottom:35px;
      flex-wrap:wrap;

    }

    .topbar-title{

      font-size:32px;
      font-weight:700;

    }

    .topbar-right{

      display:flex;
      align-items:center;
      gap:20px;

    }

    .dark-btn{

      width:45px;
      height:45px;
      border:none;
      border-radius:10px;
      background:#111827;
      color:#fff;
      cursor:pointer;
      font-size:18px;

    }

    .admin-profile{

      display:flex;
      align-items:center;
      gap:12px;
      background:#fff;
      padding:10px 16px;
      border-radius:15px;
      box-shadow:0 5px 15px rgba(0,0,0,0.08);

    }

    body.dark-mode .admin-profile{

      background:#1f2937;

    }

    .admin-profile img{

      width:45px;
      height:45px;
      border-radius:50%;

    }

    /* FORM CONTAINER */

    .add-news-container{

      background:#fff;
      padding:35px;
      border-radius:25px;
      box-shadow:0 10px 30px rgba(0,0,0,0.08);

    }

    body.dark-mode .add-news-container{

      background:#1f2937;

    }

    /* FORM */

    .form-grid{

      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:25px;

    }

    .form-group{

      display:flex;
      flex-direction:column;

    }

    .form-group.full{

      grid-column:1 / -1;

    }

    .form-group label{

      margin-bottom:10px;
      font-weight:600;
      font-size:15px;

    }

    .form-group input,
    .form-group select,
    .form-group textarea{

      width:100%;
      padding:16px;
      border-radius:14px;
      border:1px solid #ddd;
      outline:none;
      font-size:15px;
      background:#fff;

    }

    body.dark-mode .form-group input,
    body.dark-mode .form-group select,
    body.dark-mode .form-group textarea{

      background:#111827;
      color:#fff;
      border:1px solid #374151;

    }

    .checkbox-group{

      flex-direction:row;
      align-items:center;
      gap:12px;

    }

    .checkbox-group input{

      width:auto;

    }

    textarea{

      resize:none;

    }

    /* IMAGE PREVIEW */

    .image-preview{

      width:100%;
      height:250px;
      border-radius:18px;
      overflow:hidden;
      margin-top:15px;
      background:#f1f1f1;
      display:none;

    }

    .image-preview img{

      width:100%;
      height:100%;
      object-fit:cover;

    }

    /* BUTTON */

    .publish-btn{

      width:100%;
      padding:17px;
      border:none;
      border-radius:16px;
      background:#ff3c00;
      color:#fff;
      font-size:17px;
      font-weight:600;
      cursor:pointer;
      transition:0.3s;
      margin-top:10px;

    }

    .publish-btn:hover{

      background:#e63300;
      transform:translateY(-2px);

    }

    /* RESPONSIVE */

    @media(max-width:991px){

      .sidebar{

        left:-280px;

      }

      .sidebar.active{

        left:0;

      }

      .main-content{

        margin-left:0;
        padding:90px 20px 30px;

      }

      .mobile-menu-btn{

        display:flex;

      }

      .form-grid{

        grid-template-columns:1fr;

      }

    }

    @media(max-width:768px){

      .topbar{

        flex-direction:column;
        align-items:flex-start;

      }

      .topbar-title{

        font-size:26px;

      }

      .add-news-container{

        padding:25px;

      }

    }

    @media(max-width:480px){

      .main-content{

        padding:85px 15px 20px;

      }

      .add-news-container{

        padding:20px;

      }

      .topbar-title{

        font-size:22px;

      }

      .form-group input,
      .form-group select,
      .form-group textarea{

        padding:14px;
        font-size:14px;

      }

      .publish-btn{

        padding:15px;
        font-size:15px;

      }

    }

  </style>

</head>

<body>

  <!-- MOBILE MENU -->

  <div
    class="mobile-menu-btn"
    id="mobileMenuBtn"
  >

    <i class="fa-solid fa-bars"></i>

  </div>

  <!-- SIDEBAR -->

  <div
    class="sidebar"
    id="sidebar"
  >

    <div class="sidebar-logo">

      Pushpak News

    </div>

    <ul>

      <li>

        <a href="dashboard.html">

          <i class="fa-solid fa-chart-line"></i>

          Dashboard

        </a>

      </li>

      <li class="active">

        <a href="add-news.html">

          <i class="fa-solid fa-newspaper"></i>

          Add News

        </a>

      </li>

      <li>

        <a href="manage-news.html">

          <i class="fa-solid fa-pen-to-square"></i>

          Manage News

        </a>

      </li>

      <li>

        <a href="settings.html">

          <i class="fa-solid fa-gear"></i>

          Settings

        </a>

      </li>

      <li>

        <a href="login.html">

          <i class="fa-solid fa-right-from-bracket"></i>

          Logout

        </a>

      </li>

    </ul>

  </div>

  <!-- MAIN CONTENT -->

  <div class="main-content">

    <!-- TOPBAR -->

    <div class="topbar">

      <div class="topbar-title">

        Add News

      </div>

      <div class="topbar-right">

        <button
          class="dark-btn"
          id="darkModeBtn"
        >

          <i class="fa-solid fa-moon"></i>

        </button>

        <div class="admin-profile">

          <img
            src="https://i.pravatar.cc/100"
            alt="Admin"
          >

          <span>

            Admin

          </span>

        </div>

      </div>

    </div>

    <!-- ADD NEWS FORM -->

    <div class="add-news-container">

      <form
        id="newsForm"
        enctype="multipart/form-data"
      >

        <div class="form-grid">

          <!-- TITLE -->

          <div class="form-group full">

            <label>

              News Title

            </label>

            <input
              type="text"
              id="title"
              placeholder="Enter News Title"
              required
            >

          </div>

          <!-- CATEGORY -->

          <div class="form-group">

            <label>

              Category

            </label>

            <select
              id="category"
              required
            >

              <option value="">
                Select Category
              </option>

              <option>World</option>
              <option>Politics</option>
              <option>Business</option>
              <option>Technology</option>
              <option>Sports</option>
              <option>Entertainment</option>

            </select>

          </div>

          <!-- AUTHOR -->

          <div class="form-group">

            <label>

              Author Name

            </label>

            <input
              type="text"
              id="author"
              placeholder="Enter Author Name"
              required
            >

          </div>

          <!-- IMAGE -->

          <div class="form-group">

            <label>

              Upload Featured Image

            </label>

            <input
              type="file"
              id="image"
              accept="image/*"
              required
            >

            <div
              class="image-preview"
              id="imagePreview"
            >

              <img
                id="previewImg"
                src=""
                alt="Preview"
              >

            </div>

          </div>

          <!-- VIDEO -->

          <div class="form-group">

            <label>

              Video Link

            </label>

            <input
              type="url"
              id="videoUrl"
              placeholder="Paste YouTube Video Link"
            >

          </div>

          <!-- BREAKING -->

          <div class="form-group checkbox-group full">

            <input
              type="checkbox"
              id="breakingNews"
            >

            <label for="breakingNews">

              Breaking News

            </label>

          </div>

          <!-- CONTENT -->

          <div class="form-group full">

            <label>

              Full News Content

            </label>

            <textarea
              id="content"
              rows="10"
              placeholder="Write Full News Content"
              required
            ></textarea>

          </div>

        </div>

        <!-- BUTTON -->

        <button
          type="submit"
          class="publish-btn"
        >

          Publish News

        </button>

      </form>

    </div>

  </div>

  <!-- JS -->

  <script>

    /* MOBILE SIDEBAR */

    const mobileMenuBtn =

    document.getElementById(
      "mobileMenuBtn"
    );

    const sidebar =

    document.getElementById(
      "sidebar"
    );

    mobileMenuBtn.addEventListener(

      "click",

      ()=>{

        sidebar.classList.toggle(
          "active"
        );

      }

    );

    /* DARK MODE */

    const darkModeBtn =

    document.getElementById(
      "darkModeBtn"
    );

    darkModeBtn.addEventListener(

      "click",

      ()=>{

        document.body.classList.toggle(
          "dark-mode"
        );

      }

    );

    /* IMAGE PREVIEW */

    const imageInput =

    document.getElementById(
      "image"
    );

    const imagePreview =

    document.getElementById(
      "imagePreview"
    );

    const previewImg =

    document.getElementById(
      "previewImg"
    );

    imageInput.addEventListener(

      "change",

      ()=>{

        const file =
        imageInput.files[0];

        if(file){

          previewImg.src =

          URL.createObjectURL(
            file
          );

          imagePreview.style.display =
          "block";

        }

      }

    );

    /* FORM SUBMIT */

    const newsForm =

    document.getElementById(
      "newsForm"
    );

    newsForm.addEventListener(

      "submit",

      async(e)=>{

        e.preventDefault();

        try{

          const formData =
          new FormData();

          formData.append(

            "title",

            document.getElementById(
              "title"
            ).value

          );

          formData.append(

            "category",

            document.getElementById(
              "category"
            ).value

          );

          formData.append(

            "author",

            document.getElementById(
              "author"
            ).value

          );

          formData.append(

            "videoUrl",

            document.getElementById(
              "videoUrl"
            ).value

          );

          formData.append(

            "content",

            document.getElementById(
              "content"
            ).value

          );

          formData.append(

            "breakingNews",

            document.getElementById(
              "breakingNews"
            ).checked

          );

          const imageFile =

          imageInput.files[0];

          if(imageFile){

            formData.append(
              "image",
              imageFile
            );

          }

          const response =

          await fetch(

            "https://pushpak-news-backend.onrender.com/api/news/add",

            {

              method:"POST",

              body:formData

            }

          );

          const data =
          await response.json();

          if(data.success){

            alert(
              "News Added Successfully"
            );

            newsForm.reset();

            imagePreview.style.display =
            "none";

          }

          else{

            alert(

              data.message ||

              "News Upload Failed"

            );

          }

        }

        catch(error){

          console.log(
            "UPLOAD ERROR :",
            error
          );

          alert(
            "News Upload Failed"
          );

        }

      }

    );

  </script>

</body>

</html>
