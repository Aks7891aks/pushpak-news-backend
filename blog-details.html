<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Blog Details - Pushpak News
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

</head>

<body>

  <!-- TOP HEADER -->

  <div class="top-header">

    <div class="container top-flex">

      <div class="top-left">

        <i class="fa-solid fa-calendar-days"></i>

        Friday, May 22, 2026

      </div>

      <div class="top-right">

        <a href="#">
          Login
        </a>

        <a href="#">
          Register
        </a>

      </div>

    </div>

  </div>

  <!-- NAVBAR -->

  <header>

    <div class="container navbar">

      <div class="logo">

        Pushpak News

      </div>

      <nav>

        <ul>

          <li><a href="index.html">Home</a></li>
          <li><a href="world.html">World</a></li>
          <li><a href="politics.html">Politics</a></li>
          <li><a href="business.html">Business</a></li>
          <li><a href="technology.html">Technology</a></li>
          <li><a href="sports.html">Sports</a></li>
          <li><a href="entertainment.html">Entertainment</a></li>
          <li><a href="videos.html">Videos</a></li>
          <li><a href="live-tv.html">Live TV</a></li>

        </ul>

      </nav>

    </div>

  </header>

  <!-- BLOG DETAILS -->

  <section class="news-details-section">

    <div class="container">

      <div
        class="news-details"
        id="blogDetails"
      >

        Loading Blog...

      </div>

    </div>

  </section>

  <!-- FOOTER -->

  <footer>

    <div class="container footer-grid">

      <div class="footer-about">

        <h2>
          Pushpak News
        </h2>

        <p>
          International digital news platform with blogs, articles and global coverage.
        </p>

      </div>

    </div>

  </footer>

  <!-- JS -->

  <script>

    async function loadBlogDetails(){

      const params =
        new URLSearchParams(
          window.location.search
        );

      const blogId =
        params.get("id");

      try{

        const response =
          await fetch(
            "https://pushpak-news-backend.onrender.com/api/blogs"
          );

        const data =
          await response.json();

        const blog =
          data.blogs.find(
            (item)=>
              item._id === blogId
          );

        const container =
          document.getElementById(
            "blogDetails"
          );

        if(!blog){

          container.innerHTML =
            "<h2>Blog Not Found</h2>";

          return;

        }

        container.innerHTML = `

          <div class="details-card">

            <img
              src="${blog.image}"
              alt="${blog.title}"
              class="details-image"
            >

            <div class="details-content">

              <span class="details-category">

                Blog Article

              </span>

              <h1>

                ${blog.title}

              </h1>

              <div class="details-meta">

                <span>

                  By ${blog.author}

                </span>

                <span>

                  ${new Date(
                    blog.createdAt
                  ).toLocaleDateString()}

                </span>

              </div>

              <p class="details-description">

                ${blog.content}

              </p>

              <!-- SHARE BUTTONS -->

              <div class="share-buttons">

                <a
                  href="https://wa.me/?text=${window.location.href}"
                  target="_blank"
                  class="share-btn whatsapp"
                >

                  <i class="fa-brands fa-whatsapp"></i>

                  WhatsApp

                </a>

                <a
                  href="https://www.facebook.com/sharer/sharer.php?u=${window.location.href}"
                  target="_blank"
                  class="share-btn facebook"
                >

                  <i class="fa-brands fa-facebook-f"></i>

                  Facebook

                </a>

                <a
                  href="https://twitter.com/intent/tweet?url=${window.location.href}"
                  target="_blank"
                  class="share-btn twitter"
                >

                  <i class="fa-brands fa-x-twitter"></i>

                  Twitter

                </a>

                <button
                  onclick="copyLink()"
                  class="share-btn copy"
                >

                  <i class="fa-solid fa-link"></i>

                  Copy Link

                </button>

              </div>

            </div>

          </div>

        `;

      }

      catch(error){

        console.log(error);

      }

    }

    loadBlogDetails();

    /* COPY LINK */

    function copyLink(){

      navigator.clipboard.writeText(
        window.location.href
      );

      alert(
        "Link Copied Successfully"
      );

    }

  </script>

</body>

</html>
