<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit News - Pushpak News</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      background:#f5f7fb;
      display:flex;
      min-height:100vh;
    }

    body.dark-mode{
      background:#111827;
      color:#fff;
    }

    /* MOBILE MENU */
    .mobile-menu-btn{
      position:fixed;
      top:15px;
      left:15px;
      width:45px;
      height:45px;
      background:#ff3c00;
      color:#fff;
      border-radius:10px;
      display:none;
      align-items:center;
      justify-content:center;
      font-size:20px;
      cursor:pointer;
      z-index:2000;
    }

    /* SIDEBAR */
    .sidebar{
      width:270px;
      background:#111827;
      color:#fff;
      min-height:100vh;
      padding:25px 20px;
      position:fixed;
      left:0;
      top:0;
      overflow-y:auto;
      transition:0.3s;
      z-index:1000;
    }

    .sidebar-logo{
      font-size:28px;
      font-weight:700;
      text-align:center;
      margin-bottom:40px;
    }

    .sidebar ul{
      list-style:none;
    }

    .sidebar ul li{
      margin-bottom:12px;
    }

    .sidebar ul li a{
      display:flex;
      align-items:center;
      gap:14px;
      padding:15px;
      border-radius:12px;
      text-decoration:none;
      color:#fff;
      transition:0.3s;
    }

    .sidebar ul li.active a,
    .sidebar ul li a:hover{
      background:#ff3c00;
    }

    /* MAIN CONTENT */
    .main-content{
      flex:1;
      margin-left:270px;
      padding:30px;
    }

    /* TOPBAR */
    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:20px;
      margin-bottom:35px;
      flex-wrap:wrap;
    }

    .topbar-title{
      font-size:32px;
      font-weight:700;
    }

    .topbar-right{
      display:flex;
      align-items:center;
      gap:20px;
    }

    .dark-btn{
      width:45px;
      height:45px;
      border:none;
      border-radius:10px;
      background:#111827;
      color:#fff;
      cursor:pointer;
      font-size:18px;
    }

    .admin-profile{
      display:flex;
      align-items:center;
      gap:12px;
      background:#fff;
      padding:10px 16px;
      border-radius:15px;
      box-shadow:0 5px 15px rgba(0,0,0,0.08);
    }

    body.dark-mode .admin-profile{
      background:#1f2937;
    }

    .admin-profile img{
      width:45px;
      height:45px;
      border-radius:50%;
    }

    /* FORM CONTAINER */
    .edit-news-container{
      background:#fff;
      padding:35px;
      border-radius:25px;
      box-shadow:0 10px 30px rgba(0,0,0,0.08);
    }

    body.dark-mode .edit-news-container{
      background:#1f2937;
    }

    /* FORM GRID */
    .form-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:25px;
    }

    .form-group{
      display:flex;
      flex-direction:column;
    }

    .form-group.full{
      grid-column:1 / -1;
    }

    .form-group label{
      margin-bottom:10px;
      font-weight:600;
    }

    .form-group input,
    .form-group textarea,
    .form-group select{
      width:100%;
      padding:16px;
      border-radius:14px;
      border:1px solid #ddd;
      outline:none;
      font-size:15px;
      background:#fff;
    }

    body.dark-mode .form-group input,
    body.dark-mode .form-group textarea,
    body.dark-mode .form-group select{
      background:#111827;
      color:#fff;
      border:1px solid #374151;
    }

    textarea{
      resize:none;
    }

    /* IMAGE PREVIEW */
    .image-preview{
      width:100%;
      height:250px;
      border-radius:18px;
      overflow:hidden;
      margin-top:15px;
      background:#f1f1f1;
    }

    .image-preview img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    /* BUTTON */
    .update-btn{
      width:100%;
      padding:17px;
      border:none;
      border-radius:16px;
      background:#ff3c00;
      color:#fff;
      font-size:17px;
      font-weight:600;
      cursor:pointer;
      transition:0.3s;
      margin-top:10px;
    }

    .update-btn:hover{
      background:#e63300;
      transform:translateY(-2px);
    }

    /* RESPONSIVE */
    @media(max-width:991px){
      .sidebar{
        left:-280px;
      }
      .sidebar.active{
        left:0;
      }
      .main-content{
        margin-left:0;
        padding:90px 20px 30px;
      }
      .mobile-menu-btn{
        display:flex;
      }
      .form-grid{
        grid-template-columns:1fr;
      }
    }

    @media(max-width:768px){
      .topbar{
        flex-direction:column;
        align-items:flex-start;
      }
      .topbar-title{
        font-size:26px;
      }
      .edit-news-container{
        padding:25px;
      }
    }

    @media(max-width:480px){
      .main-content{
        padding:85px 15px 20px;
      }
      .edit-news-container{
        padding:20px;
      }
      .topbar-title{
        font-size:22px;
      }
      .form-group input,
      .form-group textarea,
      .form-group select{
        padding:14px;
        font-size:14px;
      }
      .update-btn{
        padding:15px;
        font-size:15px;
      }
    }
  </style>
</head>

<body>

  <div class="mobile-menu-btn" id="mobileMenuBtn">
    <i class="fa-solid fa-bars"></i>
  </div>

  <div class="sidebar" id="sidebar">
    <div class="sidebar-logo">Pushpak News</div>
    <ul>
      <li>
        <a href="dashboard.html">
          <i class="fa-solid fa-chart-line"></i> Dashboard
        </a>
      </li>
      <li>
        <a href="add-news.html">
          <i class="fa-solid fa-newspaper"></i> Add News
        </a>
      </li>
      <li class="active">
        <a href="manage-news.html">
          <i class="fa-solid fa-pen-to-square"></i> Manage News
        </a>
      </li>
      <li>
        <a href="settings.html">
          <i class="fa-solid fa-gear"></i> Settings
        </a>
      </li>
      <li>
        <a href="login.html">
          <i class="fa-solid fa-right-from-bracket"></i> Logout
        </a>
      </li>
    </ul>
  </div>

  <div class="main-content">
    <div class="topbar">
      <div class="topbar-title">Edit News</div>
      <div class="topbar-right">
        <button class="dark-btn" id="darkModeBtn">
          <i class="fa-solid fa-moon"></i>
        </button>
        <div class="admin-profile">
          <img src="https://i.pravatar.cc/100" alt="Admin">
          <span>Admin</span>
        </div>
      </div>
    </div>

    <div class="edit-news-container">
      <form id="editNewsForm">
        <div class="form-grid">
          <div class="form-group full">
            <label>News Title</label>
            <input type="text" id="title" placeholder="News Title" required>
          </div>

          <div class="form-group">
            <label>Category</label>
            <select id="category">
              <option>World</option>
              <option>Politics</option>
              <option>Business</option>
              <option>Technology</option>
              <option>Sports</option>
              <option>Entertainment</option>
            </select>
          </div>

          <div class="form-group">
            <label>Author Name</label>
            <input type="text" id="author" placeholder="Author Name" required>
          </div>

          <div class="form-group">
            <label>Image URL</label>
            <input type="text" id="image" placeholder="Image URL" required>
            <div class="image-preview">
              <img id="previewImage" src="" alt="Preview">
            </div>
          </div>

          <div class="form-group">
            <label>Video URL</label>
            <input type="text" id="videoUrl" placeholder="Video URL">
          </div>

          <div class="form-group full">
            <label>Short Description</label>
            <textarea id="shortDescription" rows="4" placeholder="Short Description" required></textarea>
          </div>

          <div class="form-group full">
            <label>Full News Content</label>
            <textarea id="content" rows="10" placeholder="Full News Content" required></textarea>
          </div>
        </div>

        <button type="submit" class="update-btn">Update News</button>
      </form>
    </div>
  </div>

  <script>
    const BACKEND_URL = "https://pushpak-news-backend.onrender.com";

    /* MOBILE SIDEBAR */
    const mobileMenuBtn = document.getElementById("mobileMenuBtn");
    const sidebar = document.getElementById("sidebar");
    mobileMenuBtn.addEventListener("click", () => {
      sidebar.classList.toggle("active");
    });

    /* DARK MODE */
    const darkModeBtn = document.getElementById("darkModeBtn");
    darkModeBtn.addEventListener("click", () => {
      document.body.classList.toggle("dark-mode");
    });

    /* GET ID */
    const params = new URLSearchParams(window.location.search);
    const newsId = params.get("id");

    // 🛠️ SAFE IMAGE RESOLVER FUNCTION
    function getSafeImageUrl(imagePath) {
      const fallbackImg = "https://images.unsplash.com/photo-1495020689067-958852a7765e?q=80&w=1200&auto=format&fit=crop";
      if (!imagePath || imagePath.trim() === "") return fallbackImg;
      
      let path = imagePath.trim();
      if (path.includes("http://127.0.0.1") || path.includes("localhost")) {
        try {
          path = new URL(path).pathname;
        } catch(e) { console.error(e); }
      }
      return path.startsWith("http") ? path : `${BACKEND_URL}${path.startsWith('/') ? '' : '/'}${path}`;
    }

    /* LOAD NEWS */
    async function loadNews(){
      try{
        const response = await fetch(`${BACKEND_URL}/api/news`);
        const data = await response.json();
        const news = data.news.find((item) => item._id === newsId);

        if(!news){
          alert("News not found");
          return;
        }

        document.getElementById("title").value = news.title || "";
        document.getElementById("category").value = news.category || "World";
        document.getElementById("author").value = news.author || "";
        document.getElementById("image").value = news.image || "";
        document.getElementById("videoUrl").value = news.videoUrl || "";
        document.getElementById("shortDescription").value = news.shortDescription || "";
        document.getElementById("content").value = news.content || "";
        
        // Dynamic Safe Image Feed Parser
        document.getElementById("previewImage").src = getSafeImageUrl(news.image);
      }
      catch(error){
        console.log(error);
      }
    }

    loadNews();

    /* LIVE IMAGE PREVIEW INPUT LISTENER */
    document.getElementById("image").addEventListener("input", () => {
      const value = document.getElementById("image").value;
      document.getElementById("previewImage").src = getSafeImageUrl(value);
    });

    /* UPDATE NEWS VIA PUT REQUEST */
    document.getElementById("editNewsForm").addEventListener("submit", async(e) => {
      e.preventDefault();

      const updatedNews = {
        title: document.getElementById("title").value,
        category: document.getElementById("category").value,
        author: document.getElementById("author").value,
        image: document.getElementById("image").value,
        videoUrl: document.getElementById("videoUrl").value,
        shortDescription: document.getElementById("shortDescription").value,
        content: document.getElementById("content").value
      };

      try{
        const response = await fetch(`${BACKEND_URL}/api/news/${newsId}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(updatedNews)
        });

        const data = await response.json();
        alert(data.message || "News Updated Successfully!");
        window.location.href = "manage-news.html";
      }
      catch(error){
        console.log(error);
        alert("Failed to update news. Check console.");
      }
    });
  </script>
</body>

</html>
