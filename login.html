<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Pushpak News Admin Login
  </title>

  <!-- GOOGLE FONT -->

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- FONT AWESOME -->

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

  <!-- CSS -->

  <style>

    *{

      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;

    }

    body{

      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:

      linear-gradient(
        135deg,
        rgba(0,0,0,0.85),
        rgba(0,0,0,0.75)
      ),

      url("https://images.unsplash.com/photo-1495020689067-958852a7765e?q=80&w=1400&auto=format&fit=crop");

      background-size:cover;
      background-position:center;
      padding:20px;

    }

    .login-container{

      width:100%;
      max-width:430px;

    }

    .login-box{

      background:rgba(255,255,255,0.1);
      backdrop-filter:blur(15px);
      border:1px solid rgba(255,255,255,0.2);
      border-radius:25px;
      padding:45px 35px;
      box-shadow:0 10px 40px rgba(0,0,0,0.3);
      color:#fff;

    }

    .login-logo{

      text-align:center;
      font-size:34px;
      font-weight:700;
      margin-bottom:10px;

    }

    .login-subtitle{

      text-align:center;
      margin-bottom:35px;
      color:#ddd;
      font-size:15px;

    }

    .login-box h2{

      text-align:center;
      margin-bottom:30px;
      font-size:28px;

    }

    .input-box{

      position:relative;
      margin-bottom:25px;

    }

    .input-box i{

      position:absolute;
      top:50%;
      left:18px;
      transform:translateY(-50%);
      color:#999;
      font-size:16px;

    }

    .input-box input{

      width:100%;
      padding:16px 18px 16px 50px;
      border:none;
      outline:none;
      border-radius:14px;
      background:#fff;
      font-size:16px;
      color:#111;

    }

    .input-box input::placeholder{

      color:#777;

    }

    .remember-box{

      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:25px;
      font-size:14px;

    }

    .remember-box label{

      display:flex;
      align-items:center;
      gap:8px;

    }

    .remember-box a{

      color:#fff;
      text-decoration:none;

    }

    .login-btn{

      width:100%;
      padding:16px;
      border:none;
      border-radius:14px;
      background:#ff3c00;
      color:#fff;
      font-size:17px;
      font-weight:600;
      cursor:pointer;
      transition:0.3s;

    }

    .login-btn:hover{

      background:#e63300;
      transform:translateY(-2px);

    }

    .bottom-text{

      text-align:center;
      margin-top:25px;
      font-size:14px;
      color:#ddd;

    }

    .bottom-text a{

      color:#fff;
      text-decoration:none;
      font-weight:600;

    }

    /* RESPONSIVE */

    @media(max-width:768px){

      .login-box{

        padding:35px 25px;

      }

      .login-logo{

        font-size:28px;

      }

      .login-box h2{

        font-size:24px;

      }

    }

    @media(max-width:480px){

      body{

        padding:15px;

      }

      .login-box{

        padding:30px 20px;
        border-radius:20px;

      }

      .login-logo{

        font-size:24px;

      }

      .login-box h2{

        font-size:22px;

      }

      .input-box input{

        padding:14px 14px 14px 45px;
        font-size:15px;

      }

      .login-btn{

        padding:14px;
        font-size:15px;

      }

      .remember-box{

        flex-direction:column;
        align-items:flex-start;
        gap:10px;

      }

    }

  </style>

</head>

<body>

  <div class="login-container">

    <div class="login-box">

      <div class="login-logo">

        Pushpak News

      </div>

      <div class="login-subtitle">

        International Digital News Platform

      </div>

      <h2>

        Admin Login

      </h2>

      <form id="loginForm">

        <div class="input-box">

          <i class="fa-solid fa-user"></i>

          <input
            type="text"
            placeholder="Admin Username"
            required
          >

        </div>

        <div class="input-box">

          <i class="fa-solid fa-lock"></i>

          <input
            type="password"
            placeholder="Password"
            required
          >

        </div>

        <div class="remember-box">

          <label>

            <input type="checkbox">

            Remember Me

          </label>

          <a href="#">

            Forgot Password?

          </a>

        </div>

        <button
          type="submit"
          class="login-btn"
        >

          Login

        </button>

      </form>

      <div class="bottom-text">

        © 2026 Pushpak News Admin Panel

      </div>

    </div>

  </div>

  <!-- JS -->

  <script>

    const loginForm =

    document.getElementById(
      "loginForm"
    );

    loginForm.addEventListener(

      "submit",

      (e)=>{

        e.preventDefault();

        alert(
          "Login Successfully"
        );

      }

    );

  </script>

</body>

</html>
