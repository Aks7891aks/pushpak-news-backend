<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Manage News - Pushpak News
  </title>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >

  <style>

    *{

      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;

    }

    body{

      background:#f4f6fb;
      display:flex;
      min-height:100vh;

    }

    body.dark-mode{

      background:#111827;
      color:#fff;

    }

    /* MOBILE MENU */

    .mobile-menu-btn{

      position:fixed;
      top:15px;
      left:15px;
      width:45px;
      height:45px;
      background:#ff3c00;
      color:#fff;
      border-radius:10px;
      display:none;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      z-index:2000;

    }

    /* SIDEBAR */

    .sidebar{

      width:270px;
      background:#111827;
      color:#fff;
      min-height:100vh;
      padding:25px 20px;
      position:fixed;
      left:0;
      top:0;
      overflow-y:auto;
      transition:0.3s;
      z-index:1000;

    }

    .sidebar-logo{

      font-size:28px;
      font-weight:700;
      text-align:center;
      margin-bottom:40px;

    }

    .sidebar ul{

      list-style:none;

    }

    .sidebar ul li{

      margin-bottom:12px;

    }

    .sidebar ul li a{

      display:flex;
      align-items:center;
      gap:14px;
      padding:15px;
      border-radius:12px;
      text-decoration:none;
      color:#fff;
      transition:0.3s;

    }

    .sidebar ul li.active a,
    .sidebar ul li a:hover{

      background:#ff3c00;

    }

    /* MAIN CONTENT */

    .main-content{

      flex:1;
      margin-left:270px;
      padding:30px;

    }

    /* TOPBAR */

    .topbar{

      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:30px;
      flex-wrap:wrap;
      gap:20px;

    }

    .topbar-title{

      font-size:32px;
      font-weight:700;

    }

    .dark-btn{

      width:45px;
      height:45px;
      border:none;
      background:#111827;
      color:#fff;
      border-radius:10px;
      cursor:pointer;
      font-size:18px;

    }

    /* NEWS GRID */

    .news-grid{

      display:grid;
      grid-template-columns:
      repeat(auto-fit,minmax(320px,1fr));

      gap:25px;

    }

    /* CARD */

    .news-card{

      background:#fff;
      border-radius:22px;
      overflow:hidden;
      box-shadow:0 10px 25px rgba(0,0,0,0.08);
      transition:0.3s;

    }

    body.dark-mode .news-card{

      background:#1f2937;

    }

    .news-card:hover{

      transform:translateY(-5px);

    }

    .news-image{

      width:100%;
      height:240px;
      object-fit:cover;
      background:#ddd;

    }

    .news-content{

      padding:22px;

    }

    .news-category{

      display:inline-block;
      background:#ff3c00;
      color:#fff;
      padding:6px 14px;
      border-radius:30px;
      font-size:13px;
      margin-bottom:14px;

    }

    .news-title{

      font-size:22px;
      font-weight:700;
      margin-bottom:12px;

    }

    .news-text{

      font-size:15px;
      line-height:1.7;
      color:#666;
      margin-bottom:18px;

    }

    body.dark-mode .news-text{

      color:#ccc;

    }

    .news-meta{

      font-size:14px;
      margin-bottom:20px;
      color:#999;

    }

    /* BUTTONS */

    .card-buttons{

      display:flex;
      gap:15px;

    }

    .edit-btn,
    .delete-btn{

      flex:1;
      padding:14px;
      border:none;
      border-radius:12px;
      cursor:pointer;
      color:#fff;
      font-weight:600;
      transition:0.3s;
      text-align:center;
      text-decoration:none;

    }

    .edit-btn{

      background:#2563eb;

    }

    .delete-btn{

      background:#dc2626;

    }

    .edit-btn:hover,
    .delete-btn:hover{

      transform:translateY(-2px);

    }

    /* LOADING */

    .loading{

      text-align:center;
      font-size:20px;
      padding:50px;

    }

    /* RESPONSIVE */

    @media(max-width:991px){

      .sidebar{

        left:-280px;

      }

      .sidebar.active{

        left:0;

      }

      .main-content{

        margin-left:0;
        padding:90px 20px 30px;

      }

      .mobile-menu-btn{

        display:flex;

      }

    }

    @media(max-width:768px){

      .topbar-title{

        font-size:26px;

      }

      .news-image{

        height:220px;

      }

    }

    @media(max-width:480px){

      .main-content{

        padding:85px 15px 20px;

      }

      .topbar-title{

        font-size:22px;

      }

      .news-title{

        font-size:20px;

      }

      .card-buttons{

        flex-direction:column;

      }

    }

  </style>

</head>

<body>

  <div
    class="mobile-menu-btn"
    id="mobileMenuBtn"
  >

    <i class="fa-solid fa-bars"></i>

  </div>

  <div
    class="sidebar"
    id="sidebar"
  >

    <div class="sidebar-logo">

      Pushpak News

    </div>

    <ul>

      <li>

        <a href="dashboard.html">

          <i class="fa-solid fa-chart-line"></i>

          Dashboard

        </a>

      </li>

      <li>

        <a href="add-news.html">

          <i class="fa-solid fa-newspaper"></i>

          Add News

        </a>

      </li>

      <li class="active">

        <a href="manage-news.html">

          <i class="fa-solid fa-pen-to-square"></i>

          Manage News

        </a>

      </li>

      <li>

        <a href="settings.html">

          <i class="fa-solid fa-gear"></i>

          Settings

        </a>

      </li>

    </ul>

  </div>

  <div class="main-content">

    <div class="topbar">

      <div class="topbar-title">

        Manage News

      </div>

      <button
        class="dark-btn"
        id="darkModeBtn"
      >

        <i class="fa-solid fa-moon"></i>

      </button>

    </div>

    <div
      class="news-grid"
      id="newsGrid"
    >

      <div class="loading">

        Loading News...

      </div>

    </div>

  </div>

  <script>

    /* MOBILE MENU */

    const mobileMenuBtn =

    document.getElementById(
      "mobileMenuBtn"
    );

    const sidebar =

    document.getElementById(
      "sidebar"
    );

    mobileMenuBtn.addEventListener(

      "click",

      ()=>{

        sidebar.classList.toggle(
          "active"
        );

      }

    );

    /* DARK MODE */

    const darkModeBtn =

    document.getElementById(
      "darkModeBtn"
    );

    darkModeBtn.addEventListener(

      "click",

      ()=>{

        document.body.classList.toggle(
          "dark-mode"
        );

      }

    );

    /* API */

    const API_URL =

    "https://pushpak-news-backend.onrender.com/api/news";

    /* NEWS GRID */

    const newsGrid =

    document.getElementById(
      "newsGrid"
    );

    /* FETCH NEWS */

    async function fetchNews(){

      try{

        const response =

        await fetch(API_URL);

        const data =
        await response.json();

        if(data.success){

          displayNews(data.news);

        }

        else{

          newsGrid.innerHTML =

          "<h2>Failed To Load News</h2>";

        }

      }

      catch(error){

        console.log(error);

        newsGrid.innerHTML =

        "<h2>Server Error</h2>";

      }

    }

    /* DISPLAY NEWS */

    function displayNews(news){

      if(news.length === 0){

        newsGrid.innerHTML =

        "<h2>No News Found</h2>";

        return;

      }

      newsGrid.innerHTML =

      news.map(item=>`

        <div class="news-card">

          <img
            src="${item.image}"
            alt="${item.title}"
            class="news-image"
          >

          <div class="news-content">

            <div class="news-category">

              ${item.category}

            </div>

            <div class="news-title">

              ${item.title}

            </div>

            <div class="news-text">

              ${item.content.slice(0,120)}...

            </div>

            <div class="news-meta">

              By ${item.author}

            </div>

            <div class="card-buttons">

              <button
                class="edit-btn"
                onclick="editNews('${item._id}')"
              >

                Edit

              </button>

              <button
                class="delete-btn"
                onclick="deleteNews('${item._id}')"
              >

                Delete

              </button>

            </div>

          </div>

        </div>

      `).join("");

    }

    /* EDIT NEWS REDIRECTION */
    function editNews(id) {
      // Yeh user ko edit page par le jayega aur URL me news ki ID pass karega
      window.location.href = `edit-news.html?id=${id}`;
    }

    /* DELETE NEWS */

    async function deleteNews(id){

      const confirmDelete =

      confirm(
        "Delete This News?"
      );

      if(!confirmDelete) return;

      try{

        const response =

        await fetch(

          `${API_URL}/${id}`,

          {

            method:"DELETE"

          }

        );

        const data =
        await response.json();

        if(data.success){

          alert(
            "News Deleted Successfully"
          );

          fetchNews();

        }

        else{

          alert(
            "Delete Failed"
          );

        }

      }

      catch(error){

        console.log(error);

        alert(
          "Server Error"
          );

      }

    }

    /* LOAD NEWS */

    fetchNews();

  </script>

</body>

</html>
