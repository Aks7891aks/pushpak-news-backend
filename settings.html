<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Settings - Pushpak News Admin
  </title>

  <!-- GOOGLE FONT -->

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- FONT AWESOME -->

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

  <!-- CSS -->

  <style>

    *{

      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;

    }

    body{

      background:#f5f7fb;
      display:flex;
      min-height:100vh;

    }

    body.dark-mode{

      background:#111827;
      color:#fff;

    }

    /* MOBILE MENU */

    .mobile-menu-btn{

      position:fixed;
      top:15px;
      left:15px;
      width:45px;
      height:45px;
      background:#ff3c00;
      color:#fff;
      border-radius:10px;
      display:none;
      align-items:center;
      justify-content:center;
      font-size:20px;
      cursor:pointer;
      z-index:2000;

    }

    /* SIDEBAR */

    .sidebar{

      width:270px;
      background:#111827;
      color:#fff;
      min-height:100vh;
      padding:25px 20px;
      position:fixed;
      left:0;
      top:0;
      overflow-y:auto;
      transition:0.3s;
      z-index:1000;

    }

    .sidebar-logo{

      font-size:28px;
      font-weight:700;
      text-align:center;
      margin-bottom:40px;

    }

    .sidebar ul{

      list-style:none;

    }

    .sidebar ul li{

      margin-bottom:12px;

    }

    .sidebar ul li a{

      display:flex;
      align-items:center;
      gap:14px;
      padding:15px;
      border-radius:12px;
      text-decoration:none;
      color:#fff;
      transition:0.3s;

    }

    .sidebar ul li.active a,
    .sidebar ul li a:hover{

      background:#ff3c00;

    }

    /* MAIN CONTENT */

    .main-content{

      flex:1;
      margin-left:270px;
      padding:30px;

    }

    /* TOPBAR */

    .topbar{

      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:20px;
      margin-bottom:35px;
      flex-wrap:wrap;

    }

    .topbar-title{

      font-size:32px;
      font-weight:700;

    }

    .topbar-right{

      display:flex;
      align-items:center;
      gap:20px;

    }

    .dark-btn{

      width:45px;
      height:45px;
      border:none;
      border-radius:10px;
      background:#111827;
      color:#fff;
      cursor:pointer;
      font-size:18px;

    }

    .admin-profile{

      display:flex;
      align-items:center;
      gap:12px;
      background:#fff;
      padding:10px 16px;
      border-radius:15px;
      box-shadow:0 5px 15px rgba(0,0,0,0.08);

    }

    body.dark-mode .admin-profile{

      background:#1f2937;

    }

    .admin-profile img{

      width:45px;
      height:45px;
      border-radius:50%;

    }

    /* SETTINGS GRID */

    .settings-grid{

      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:25px;

    }

    /* SETTINGS CARD */

    .settings-card{

      background:#fff;
      border-radius:25px;
      padding:30px;
      box-shadow:0 10px 30px rgba(0,0,0,0.08);

    }

    body.dark-mode .settings-card{

      background:#1f2937;

    }

    .settings-card h2{

      margin-bottom:25px;
      font-size:24px;

    }

    /* FORM */

    .form-group{

      margin-bottom:22px;

    }

    .form-group label{

      display:block;
      margin-bottom:10px;
      font-weight:600;

    }

    .form-group input,
    .form-group textarea,
    .form-group select{

      width:100%;
      padding:16px;
      border-radius:14px;
      border:1px solid #ddd;
      outline:none;
      font-size:15px;
      background:#fff;

    }

    body.dark-mode .form-group input,
    body.dark-mode .form-group textarea,
    body.dark-mode .form-group select{

      background:#111827;
      color:#fff;
      border:1px solid #374151;

    }

    textarea{

      resize:none;

    }

    /* LOGO PREVIEW */

    .logo-preview{

      width:120px;
      height:120px;
      border-radius:20px;
      overflow:hidden;
      margin-top:15px;
      border:2px dashed #ddd;

    }

    .logo-preview img{

      width:100%;
      height:100%;
      object-fit:cover;

    }

    /* SWITCH */

    .switch-box{

      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:16px;
      border-radius:14px;
      background:#f9fafb;
      margin-bottom:15px;

    }

    body.dark-mode .switch-box{

      background:#111827;

    }

    .switch{

      position:relative;
      width:55px;
      height:28px;

    }

    .switch input{

      opacity:0;
      width:0;
      height:0;

    }

    .slider{

      position:absolute;
      cursor:pointer;
      top:0;
      left:0;
      right:0;
      bottom:0;
      background:#ccc;
      transition:0.4s;
      border-radius:50px;

    }

    .slider:before{

      position:absolute;
      content:"";
      height:22px;
      width:22px;
      left:3px;
      bottom:3px;
      background:white;
      transition:0.4s;
      border-radius:50%;

    }

    input:checked + .slider{

      background:#ff3c00;

    }

    input:checked + .slider:before{

      transform:translateX(26px);

    }

    /* BUTTON */

    .save-btn{

      width:100%;
      padding:17px;
      border:none;
      border-radius:16px;
      background:#ff3c00;
      color:#fff;
      font-size:17px;
      font-weight:600;
      cursor:pointer;
      transition:0.3s;
      margin-top:10px;

    }

    .save-btn:hover{

      background:#e63300;
      transform:translateY(-2px);

    }

    /* RESPONSIVE */

    @media(max-width:991px){

      .sidebar{

        left:-280px;

      }

      .sidebar.active{

        left:0;

      }

      .main-content{

        margin-left:0;
        padding:90px 20px 30px;

      }

      .mobile-menu-btn{

        display:flex;

      }

      .settings-grid{

        grid-template-columns:1fr;

      }

    }

    @media(max-width:768px){

      .topbar{

        flex-direction:column;
        align-items:flex-start;

      }

      .topbar-title{

        font-size:26px;

      }

      .settings-card{

        padding:25px;

      }

    }

    @media(max-width:480px){

      .main-content{

        padding:85px 15px 20px;

      }

      .settings-card{

        padding:20px;

      }

      .topbar-title{

        font-size:22px;

      }

      .form-group input,
      .form-group textarea,
      .form-group select{

        padding:14px;
        font-size:14px;

      }

      .save-btn{

        padding:15px;
        font-size:15px;

      }

    }

  </style>

</head>

<body>

  <!-- MOBILE MENU -->

  <div
    class="mobile-menu-btn"
    id="mobileMenuBtn"
  >

    <i class="fa-solid fa-bars"></i>

  </div>

  <!-- SIDEBAR -->

  <div
    class="sidebar"
    id="sidebar"
  >

    <div class="sidebar-logo">

      Pushpak News

    </div>

    <ul>

      <li>

        <a href="dashboard.html">

          <i class="fa-solid fa-chart-line"></i>

          Dashboard

        </a>

      </li>

      <li>

        <a href="add-news.html">

          <i class="fa-solid fa-newspaper"></i>

          Add News

        </a>

      </li>

      <li>

        <a href="manage-news.html">

          <i class="fa-solid fa-pen-to-square"></i>

          Manage News

        </a>

      </li>

      <li class="active">

        <a href="settings.html">

          <i class="fa-solid fa-gear"></i>

          Settings

        </a>

      </li>

      <li>

        <a href="login.html">

          <i class="fa-solid fa-right-from-bracket"></i>

          Logout

        </a>

      </li>

    </ul>

  </div>

  <!-- MAIN CONTENT -->

  <div class="main-content">

    <!-- TOPBAR -->

    <div class="topbar">

      <div class="topbar-title">

        Website Settings

      </div>

      <div class="topbar-right">

        <button
          class="dark-btn"
          id="darkModeBtn"
        >

          <i class="fa-solid fa-moon"></i>

        </button>

        <div class="admin-profile">

          <img
            src="https://i.pravatar.cc/100"
            alt="Admin"
          >

          <span>

            Admin

          </span>

        </div>

      </div>

    </div>

    <!-- SETTINGS GRID -->

    <div class="settings-grid">

      <!-- WEBSITE SETTINGS -->

      <div class="settings-card">

        <h2>

          Website Settings

        </h2>

        <div class="form-group">

          <label>

            Website Name

          </label>

          <input
            type="text"
            value="Pushpak News"
          >

        </div>

        <div class="form-group">

          <label>

            Website Description

          </label>

          <textarea rows="5">

International Digital News Platform

          </textarea>

        </div>

        <div class="form-group">

          <label>

            Upload Logo

          </label>

          <input
            type="file"
            id="logoInput"
            accept="image/*"
          >

          <div class="logo-preview">

            <img
              id="logoPreview"
              src="https://dummyimage.com/300x300/000/fff&text=Logo"
              alt="Logo"
            >

          </div>

        </div>

        <button class="save-btn">

          Save Website Settings

        </button>

      </div>

      <!-- SOCIAL SETTINGS -->

      <div class="settings-card">

        <h2>

          Social Media Settings

        </h2>

        <div class="form-group">

          <label>

            Facebook Link

          </label>

          <input
            type="text"
            placeholder="Facebook URL"
          >

        </div>

        <div class="form-group">

          <label>

            Instagram Link

          </label>

          <input
            type="text"
            placeholder="Instagram URL"
          >

        </div>

        <div class="form-group">

          <label>

            YouTube Link

          </label>

          <input
            type="text"
            placeholder="YouTube URL"
          >

        </div>

        <div class="form-group">

          <label>

            Twitter/X Link

          </label>

          <input
            type="text"
            placeholder="Twitter URL"
          >

        </div>

        <button class="save-btn">

          Save Social Settings

        </button>

      </div>

      <!-- WEBSITE FEATURES -->

      <div class="settings-card">

        <h2>

          Website Features

        </h2>

        <div class="switch-box">

          <span>

            Enable Breaking News

          </span>

          <label class="switch">

            <input type="checkbox" checked>

            <span class="slider"></span>

          </label>

        </div>

        <div class="switch-box">

          <span>

            Enable Live TV

          </span>

          <label class="switch">

            <input type="checkbox" checked>

            <span class="slider"></span>

          </label>

        </div>

        <div class="switch-box">

          <span>

            Enable Comments

          </span>

          <label class="switch">

            <input type="checkbox" checked>

            <span class="slider"></span>

          </label>

        </div>

        <div class="switch-box">

          <span>

            Enable Dark Mode

          </span>

          <label class="switch">

            <input type="checkbox">

            <span class="slider"></span>

          </label>

        </div>

        <button class="save-btn">

          Save Feature Settings

        </button>

      </div>

      <!-- CONTACT SETTINGS -->

      <div class="settings-card">

        <h2>

          Contact Settings

        </h2>

        <div class="form-group">

          <label>

            Email Address

          </label>

          <input
            type="email"
            value="as7770827@gmail.com"
          >

        </div>

        <div class="form-group">

          <label>

            Phone Number

          </label>

          <input
            type="text"
            placeholder="+91 XXXXX XXXXX"
          >

        </div>

        <div class="form-group">

          <label>

            Company Name

          </label>

          <input
            type="text"
            value="Rural Sports Mania Pvt. Ltd."
          >

        </div>

        <div class="form-group">

          <label>

            Office Address

          </label>

          <textarea rows="4">

Aligarh, Uttar Pradesh, India

          </textarea>

        </div>

        <button class="save-btn">

          Save Contact Settings

        </button>

      </div>

    </div>

  </div>

  <!-- JS -->

  <script>

    /* MOBILE SIDEBAR */

    const mobileMenuBtn =

    document.getElementById(
      "mobileMenuBtn"
    );

    const sidebar =

    document.getElementById(
      "sidebar"
    );

    mobileMenuBtn.addEventListener(

      "click",

      ()=>{

        sidebar.classList.toggle(
          "active"
        );

      }

    );

    /* DARK MODE */

    const darkModeBtn =

    document.getElementById(
      "darkModeBtn"
    );

    darkModeBtn.addEventListener(

      "click",

      ()=>{

        document.body.classList.toggle(
          "dark-mode"
        );

      }

    );

    /* LOGO PREVIEW */

    const logoInput =

    document.getElementById(
      "logoInput"
    );

    const logoPreview =

    document.getElementById(
      "logoPreview"
    );

    logoInput.addEventListener(

      "change",

      ()=>{

        const file =

        logoInput.files[0];

        if(file){

          logoPreview.src =

          URL.createObjectURL(
            file
          );

        }

      }

    );

    /* SAVE BUTTON */

    const saveButtons =

    document.querySelectorAll(
      ".save-btn"
    );

    saveButtons.forEach((btn)=>{

      btn.addEventListener(

        "click",

        ()=>{

          alert(
            "Settings Saved Successfully"
          );

        }

      );

    });

  </script>

</body>

</html>
